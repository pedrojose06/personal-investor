<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de tendências B3</title>
<style>
/* Tokens que o painel espera do ambiente de dashboards do Claude, com valores próprios para rodar fora dele. */
:root{
  --color-fg:#1b1f1d;--color-fg-muted:#5f6b66;--color-bg:#faf9f6;--color-panel:#ffffff;--color-border-line:#e2e1dc;
  --color-ok:#1f7a4d;--color-warn:#a8741a;--color-bad:#b3392f;
  --font-anthropic-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-anthropic-serif:Georgia,"Times New Roman",serif;
  --cds-font-size-caption:13px;--cds-font-size-body:15px;--cds-font-size-heading:18px;--cds-font-size-title:26px;
  --cds-font-weight-medium:600;
  --cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:12px;--cds-gap-lg:16px;--cds-gap-xl:24px;
  --cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-md:12px;--cds-pad-lg:16px;--cds-pad-xl:24px;
  --cds-radius:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --color-fg:#e9ece9;--color-fg-muted:#9aa6a0;--color-bg:#121614;--color-panel:#1b211e;--color-border-line:#2f3833;
  --color-ok:#5fcf94;--color-warn:#e2b04f;--color-bad:#ef7a6e;color-scheme:dark;
}}
body{margin:0;background:var(--color-bg);color:var(--color-fg);line-height:1.5}
#dash-root{padding:24px 16px 48px}
#dash-erro{max-width:640px;margin:48px auto;padding:0 16px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<div id="dash-root"></div>
<script>
/*
 * Substituto mínimo da API `dash` do ambiente de dashboards do Claude.
 * Carrega os JSON de ./data, injeta ./painel/index.html e executa os desenhos.
 * Cobre só o que o painel usa: data, calc, draw, onData e setLink.
 */
(async function () {
  const DATASETS = ['resumo', 'mercado', 'indicadores', 'acoes', 'agenda', 'leitura', 'noticias', 'historico'];
  const root = document.getElementById('dash-root');
  const data = {};
  const calcs = {};
  const draws = {};
  const listeners = [];

  const dash = {
    colors: ['var(--color-fg)'],
    data(id) {
      if (calcs[id]) {
        const inputs = calcs[id].inputs.map((i) => dash.data(i));
        if (inputs.some((g) => g.status !== 'ok')) return { status: 'error', data: null };
        return { status: 'ok', data: calcs[id].fn(...inputs.map((g) => g.data)) };
      }
      if (id in data) return { status: 'ok', data: data[id] };
      return { status: 'missing', data: [] };
    },
    calc(id, def) { calcs[id] = def; },
    draw(name, fn) {
      if (fn) { draws[name] = fn; return; }
      runDraw(name);
    },
    onData(fn) { listeners.push(fn); },
    setLink(id) { history.replaceState(null, '', '#' + id); },
    refresh() {},
    params() { return {}; },
    setParams() {},
    resetParams() {},
  };
  window.dash = dash;

  function runDraw(name) {
    const fn = draws[name];
    if (!fn) return;
    root.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => fn(el));
  }
  function runAll() {
    listeners.forEach((fn) => fn());
    Object.keys(draws).forEach(runDraw);
  }

  try {
    const [html] = await Promise.all([
      fetch('painel/index.html').then((r) => { if (!r.ok) throw new Error('painel/index.html: ' + r.status); return r.text(); }),
      ...DATASETS.map((id) => fetch('data/' + id + '.json').then((r) => { if (!r.ok) throw new Error('data/' + id + '.json: ' + r.status); return r.json(); }).then((rows) => { data[id] = rows; })),
    ]);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const scripts = [...doc.querySelectorAll('script')];
    scripts.forEach((s) => s.remove());
    root.append(...doc.head.querySelectorAll('style'), ...doc.body.childNodes);
    // Cada script do painel roda em escopo próprio, como no ambiente original.
    scripts.forEach((s) => new Function('dash', s.textContent)(dash));
    runAll();
    let timer = null;
    window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(runAll, 150); });
  } catch (err) {
    const box = document.createElement('div');
    box.id = 'dash-erro';
    const p = document.createElement('p');
    p.textContent = 'Não foi possível carregar o painel: ' + err.message + '. Abra por um servidor HTTP (por exemplo, npx serve), e não direto pelo arquivo.';
    box.append(p);
    root.replaceWith(box);
  }
})();
</script>
</body>
</html>
